<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | FitFocus Gym</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
}

.navbar{
    background:#000;
    border-bottom:2px solid orange;
}

.profile-card{
    background:#1b1b1b;
    margin-top:40px;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 20px rgba(255,165,0,.25);
}

.profile-image{
    width:150px;
    height:150px;
    border-radius:50%;
    border:4px solid orange;
    object-fit:cover;
}

.title{
    color:orange;
    text-align:center;
    margin-bottom:25px;
}

label{
    color:#ffb347;
    font-weight:bold;
}

.form-control,
.form-select{

    background:#2b2b2b;
    color:white;
    border:1px solid #555;

}

.form-control:focus,
.form-select:focus{

    background:#2b2b2b;
    color:white;
    border-color:orange;
    box-shadow:none;

}

.btn-save{

    background:orange;
    color:black;
    font-weight:bold;
    border:none;
    border-radius:30px;
    padding:12px 25px;

}

.btn-save:hover{

    background:#ffb347;

}

footer{

    text-align:center;
    color:#999;
    margin-top:40px;
    padding:20px;

}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand fw-bold fs-3">

🏋 FitFocus Gym

</a>

</div>

</nav>

<div class="container">

<div class="profile-card">

<h2 class="title">

<i class="fa-solid fa-user"></i>

My Profile

</h2>

<div class="text-center mb-4">

<img src="https://via.placeholder.com/150"
class="profile-image">

<br><br>

<input type="file" class="form-control w-50 mx-auto">

</div>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label>Member ID</label>

<input type="text" class="form-control" value="FF1001" readonly>

</div>

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input type="text" class="form-control" value="Nandana PN">

</div>

<div class="col-md-6 mb-3">

<label>Date of Birth</label>

<input type="date" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Age</label>

<input type="number" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Gender</label>

<select class="form-select">

<option>Female</option>

<option>Male</option>

<option>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Phone Number</label>

<input type="tel" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input type="email" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Emergency Contact</label>

<input type="tel" class="form-control">

</div>

<div class="col-md-12 mb-3">

<label>Address</label>

<textarea class="form-control" rows="3"></textarea>

</div>

<div class="col-md-4 mb-3">

<label>Height (cm)</label>

<input type="number" class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Weight (kg)</label>

<input type="number" class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Fitness Goal</label>

<select class="form-select">

<option>Weight Loss</option>

<option>Weight Gain</option>

<option>Muscle Building</option>

<option>General Fitness</option>

</select>

</div>

</div>

<div class="text-end mt-3">

<button class="btn-save">

<i class="fa-solid fa-floppy-disk"></i>

Save Changes

</button>

</div>

</form>

</div>

</div>

<footer>

© 2026 FitFocus Gym Management System

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
