<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitFocus | My Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{

background:#f5f5f5;

font-family:'Segoe UI',sans-serif;

}

.navbar{

background:#111;

}

.navbar-brand{

color:#edff4d!important;

font-size:28px;

font-weight:bold;

}

.profile-header{

background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80");

background-size:cover;

background-position:center;

padding:80px 0;

color:white;

text-align:center;

}

.profile-image{

width:150px;

height:150px;

border-radius:50%;

border:5px solid white;

object-fit:cover;

box-shadow:0 5px 20px rgba(0,0,0,.4);

}

.profile-card{

border:none;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.15);

transition:.3s;

}

.profile-card:hover{

transform:translateY(-5px);

}

.card-title{

color:#dc3545;

font-weight:bold;

}

.info{

font-size:17px;

margin-bottom:15px;

}

.info i{

color:#dc3545;

margin-right:10px;

}

.progress{

height:25px;

border-radius:30px;

}

.btn-custom{

background:#dc3545;

color:white;

font-weight:bold;

}

.btn-custom:hover{

background:#bb2d3b;

color:white;

}

footer{

background:#111;

color:white;

padding:20px;

margin-top:40px;

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand" href="#">FitFocus</a>

</div>

</nav>

<section class="profile-header">

<img src="https://i.pravatar.cc/200" class="profile-image">

<h2 class="mt-3">Nandana P N</h2>

<p>Premium Member</p>

</section>

<div class="container my-5">

<div class="row">

<div class="col-lg-4">

<div class="card profile-card p-4">

<h4 class="card-title">

<i class="bi bi-person-circle"></i>

Personal Details

</h4>

<hr>

<p class="info">

<i class="bi bi-envelope-fill"></i>

nandana@email.com

</p>

<p class="info">

<i class="bi bi-telephone-fill"></i>

+91 9876543210

</p>

<p class="info">

<i class="bi bi-calendar-event"></i>

Age : 21 Years

</p>

<p class="info">

<i class="bi bi-gender-female"></i>

Female

</p>

<p class="info">

<i class="bi bi-geo-alt-fill"></i>

Kerala, India

</p>

</div>

</div>

<div class="col-lg-8">

<div class="card profile-card p-4 mb-4">

<h4 class="card-title">

<i class="bi bi-heart-pulse-fill"></i>

Fitness Information

</h4>

<hr>

<div class="row">

<div class="col-md-6">

<p class="info">

<strong>Height</strong>

<br>

165 cm

</p>

</div>

<div class="col-md-6">

<p class="info">

<strong>Weight</strong>

<br>

60 kg

</p>

</div>

<div class="col-md-6">

<p class="info">

<strong>BMI</strong>

<br>

22.0

</p>

</div>

<div class="col-md-6">

<p class="info">

<strong>Goal</strong>

<br>

Weight Loss

</p>

</div>

</div>

</div>

<div class="card profile-card p-4 mb-4">

<h4 class="card-title">

<i class="bi bi-award-fill"></i>








<i class="bi bi-gear-fill"></i>

Account Settings

</h4>

<hr>

<button class="btn btn-custom me-2">

<i class="bi bi-pencil-square"></i>

Edit Profile

</button>

<button class="btn btn-outline-danger">

<i class="bi bi-key-fill"></i>

Change Password

</button>

</div>

</div>

</div>

</div>

<footer class="text-center">

<h5>FitFocus Gym Management System</h5>

<p>© 2026 All Rights Reserved.</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
