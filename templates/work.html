<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Workout Plan | FitFocus Gym</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
background:#111;
font-family:Arial,sans-serif;
color:white;
}

.navbar{
background:#000;
border-bottom:2px solid orange;
}

.container-box{
margin-top:40px;
}

.card{
background:#1c1c1c;
border:none;
border-radius:20px;
box-shadow:0 0 15px rgba(255,165,0,.3);
}

.card-header{
background:orange;
color:black;
font-size:24px;
font-weight:bold;
border-radius:20px 20px 0 0 !important;
}

label{
color:#ffb347;
font-weight:bold;
}

.form-control,
.form-select{

background:#2b2b2b;
color:white;
border:1px solid #555;

}

.form-control:focus,
.form-select:focus{

background:#2b2b2b;
color:white;
border-color:orange;
box-shadow:none;

}

.table{

color:white;

}

.table-dark{

background:#222;

}

.btn-save{

background:orange;
color:black;
font-weight:bold;
border:none;
padding:10px 30px;
border-radius:30px;

}

.btn-save:hover{

background:#ffb347;

}

footer{

margin-top:40px;
text-align:center;
color:#888;
padding:20px;

}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand fw-bold fs-3">

🏋 FitFocus Gym

</a>

</div>

</nav>

<div class="container container-box">

<div class="card">

<div class="card-header">

<i class="fa-solid fa-dumbbell"></i>

Workout Plan Assignment

</div>

<div class="card-body">

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label>Client Name</label>

<input type="text" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Member ID</label>

<input type="text" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Workout Level</label>

<select class="form-select">

<option>Beginner</option>

<option>Intermediate</option>

<option>Advanced</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Fitness Goal</label>

<select class="form-select">

<option>Weight Loss</option>

<option>Muscle Gain</option>

<option>General Fitness</option>

<option>Strength Training</option>

</select>

</div>

</div>

<h4 class="text-warning mt-4">

Weekly Workout Plan

</h4>

<table class="table table-dark table-bordered text-center">

<thead>

<tr>

<th>Day</th>

<th>Exercise</th>

<th>Sets</th>

<th>Reps</th>

<th>Duration</th>

</tr>

</thead>

<tbody>

<tr>

<td>Monday</td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

</tr>

<tr>

<td>Tuesday</td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

</tr>

<tr>

<td>Wednesday</td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

</tr>

<tr>

<td>Thursday</td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

</tr>

<tr>

<td>Friday</td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

</tr>

<tr>

<td>Saturday</td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

<td><input class="form-control"></td>

</tr>

<tr>

<td>Sunday</td>

<td colspan="4">

Rest Day

</td>

</tr>

</tbody>

</table>

<div class="mb-3">

<label>Trainer Notes</label>

<textarea class="form-control" rows="4"></textarea>

</div>

<div class="text-end">

<button class="btn-save">

<i class="fa-solid fa-floppy-disk"></i>

Save Workout

</button>

</div>

</form>

</div>

</div>

</div>

<footer>

© 2026 FitFocus Gym Management System

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
