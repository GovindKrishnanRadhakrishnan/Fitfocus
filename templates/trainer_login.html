<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitFocus | Trainer Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Segoe UI',sans-serif;

height:100vh;

background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

}

.login-card{

width:420px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.2);

border-radius:20px;

padding:40px;

box-shadow:0 10px 25px rgba(0,0,0,.4);

color:white;

}

.login-card:hover{

transform:translateY(-5px);

transition:.3s;

}

.logo{

text-align:center;

margin-bottom:25px;

}

.logo i{

font-size:60px;

color:#ffd43b;

}

.logo h2{

margin-top:10px;

font-weight:bold;

}

.fit{

color:#dc3545;

}

.gym{

color:#ffd43b;

}

.form-label{

font-weight:bold;

}

.form-control{

background:rgba(255,255,255,.15);

border:none;

color:white;

}

.form-control::placeholder{

color:#ddd;

}

.form-control:focus{

background:rgba(255,255,255,.2);

color:white;

box-shadow:none;

border:1px solid #ffd43b;

}

.btn-login{

width:100%;

background:#198754;

color:white;

font-weight:bold;

padding:12px;

border-radius:30px;

}

.btn-login:hover{

background:#157347;

}

.links{

text-align:center;

margin-top:20px;

}

.links a{

color:#ffd43b;

text-decoration:none;

}

.links a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">

<i class="bi bi-person-badge-fill"></i>

<h2>

<span class="fit">FITFOCUS</span>

<span class="gym">GYM</span>

</h2>

<h5>Trainer Login</h5>

</div>

<form>

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<input type="email"

class="form-control"

placeholder="Enter Trainer Email">

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input type="password"

class="form-control"

placeholder="Enter Password">

</div>

<a href="trainer_dashboard.html" class="btn btn-login">
    <i class="bi bi-box-arrow-in-right"></i>
    Login
</a>

<div class="links">

<p class="mt-3">

<a href="#">Forgot Password?</a>

</p>

<p>

<a href="index.html">

<i class="bi bi-arrow-left-circle"></i>

Back to Home

</a>

</p>

</div>

</form>

</div>

</body>

</html>
