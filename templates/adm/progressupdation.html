<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Progress Management | FitFocus Gym</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#111;
    font-family:Arial,sans-serif;
    color:white;
}

.navbar{
    background:#000;
    border-bottom:2px solid orange;
}

.progress-card{
    background:#1b1b1b;
    border-radius:20px;
    padding:30px;
    margin-top:40px;
    box-shadow:0 0 20px rgba(255,165,0,.3);
}

h2{
    color:orange;
    text-align:center;
    margin-bottom:25px;
}

label{
    color:#ffb347;
    font-weight:bold;
}

.form-control,
.form-select{
    background:#2b2b2b;
    color:white;
    border:1px solid #555;
}

.form-control:focus,
.form-select:focus{
    background:#2b2b2b;
    color:white;
    border-color:orange;
    box-shadow:none;
}

.table{
    color:white;
}

.table th{
    color:orange;
}

.btn-save{
    background:orange;
    color:black;
    border:none;
    font-weight:bold;
    padding:10px 25px;
    border-radius:30px;
}

.btn-update{
    background:#198754;
    color:white;
    border:none;
    font-weight:bold;
    padding:10px 25px;
    border-radius:30px;
}

.btn-save:hover{
    background:#ffb347;
}

.btn-update:hover{
    background:#157347;
}

footer{
    margin-top:40px;
    text-align:center;
    color:#999;
    padding:20px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand fw-bold fs-3">

🏋 FitFocus Gym

</a>

</div>

</nav>

<div class="container">

<div class="progress-card">

<h2>

<i class="fa-solid fa-chart-line"></i>

Progress Management (Trainer/Admin)

</h2>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label>Client Name</label>

<input type="text" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Member ID</label>

<input type="text" class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Height (cm)</label>

<input type="number" class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Weight (kg)</label>

<input type="number" class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>BMI</label>

<input type="number" step="0.1" class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Body Fat (%)</label>

<input type="number" class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Progress Date</label>

<input type="date" class="form-control">

</div>

<div class="col-md-4 mb-3">

<label>Status</label>

<select class="form-select">
<option>Excellent</option>
<option>Good</option>
<option>Average</option>
<option>Needs Improvement</option>
</select>

</div>

</div>

<h4 class="text-warning mt-4">
Progress History
</h4>

<table class="table table-dark table-bordered text-center">

<thead>

<tr>

<th>Date</th>
<th>Weight</th>
<th>BMI</th>
<th>Body Fat</th>
<th>Status</th>

</tr>

</thead>

<tbody>

<tr>
<td>01-06-2026</td>
<td>60 kg</td>
<td>22.0</td>
<td>21%</td>
<td>Good</td>
</tr>

<tr>
<td>15-06-2026</td>
<td>59 kg</td>
<td>21.7</td>
<td>20%</td>
<td>Improving</td>
</tr>

</tbody>

</table>

<div class="mb-3">

<label>Trainer Remarks</label>

<textarea class="form-control" rows="4"
placeholder="Enter progress remarks..."></textarea>

</div>

<div class="text-end">

<button class="btn-save">

<i class="fa-solid fa-floppy-disk"></i>

Save Progress

</button>

<button class="btn-update">

<i class="fa-solid fa-pen"></i>

Update Progress

</button>

</div>

</form>

</div>

</div>

<footer>

© 2026 FitFocus Gym Management System

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
