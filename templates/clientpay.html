<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitFocus Gym | Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
    url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

.payment-box{
    width:700px;
    margin:50px auto;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
    overflow:hidden;
}

.header{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

.header h2{
    margin:0;
}

.fit{
    color:#dc3545;
}

.gym{
    color:#edff4d;
}

.content{
    padding:30px;
}

.method{
    border:2px solid #ddd;
    border-radius:15px;
    padding:20px;
    margin-bottom:25px;
}

.method h4{
    color:#dc3545;
}

.qr{
    width:220px;
    height:220px;
    border:1px solid #ccc;
    padding:10px;
    margin:auto;
}

.qr img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.btn-pay{
    width:100%;
    font-size:18px;
    font-weight:bold;
    border-radius:30px;
}

.footer{
    text-align:center;
    padding:20px;
    background:#111;
    color:white;
}

</style>

</head>
<body>

<div class="payment-box">

<div class="header">

<h2><span class="fit">FITFOCUS</span> <span class="gym">GYM</span></h2>

<h4>Membership Payment</h4>

</div>

<div class="content">

<div class="mb-4">

<label><b>Member Name</b></label>

<input type="text" class="form-control" value="Nandana P N">

</div>

<div class="mb-4">

<label><b>Membership Fee (₹)</b></label>

<input type="text" class="form-control" value="1000">

</div>

<div class="method">

<h4>Pay using UPI ID</h4>

<p><b>UPI ID :</b> fitfocusgym@okaxis</p>

<a href="upi://pay?pa=fitfocusgym@okaxis&pn=FitFocus Gym&am=1000&cu=INR"
class="btn btn-success btn-pay">

Pay with UPI

</a>

</div>

<div class="method text-center">

<h4>OR Scan QR Code</h4>

<div class="qr">

<!-- Replace this image with your own QR Code -->

<img src="images/qr.png" alt="QR Code">

</div>

<p class="mt-3">

Scan this QR Code using Google Pay, PhonePe, Paytm or any UPI App.

</p>

</div>

<div class="text-center">

<a href="payment_success.html" class="btn btn-primary btn-pay">

I've Completed Payment

</a>

</div>

</div>

<div class="footer">

© 2026 FitFocus Gym Management System

</div>

</div>

</body>
</html>
