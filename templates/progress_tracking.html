<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitFocus | Progress Tracking</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
    background:#f4f6f9;
    font-family:'Segoe UI',sans-serif;
}

.navbar{
    background:#111;
}

.navbar-brand{
    font-size:28px;
    font-weight:bold;
}

.fit{
    color:#dc3545;
}

.gym{
    color:#ffd43b;
}

.header{
    background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    color:white;
    text-align:center;
    padding:70px;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.section-title{
    color:#dc3545;
    font-weight:bold;
}

.form-control,
.form-select{
    border-radius:10px;
}

.btn-save{
    background:#198754;
    color:white;
    font-weight:bold;
}

.btn-save:hover{
    background:#157347;
    color:white;
}

.progress{
    height:25px;
}

footer{
    background:#111;
    color:white;
    padding:20px;
    margin-top:40px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand">

<span class="fit">FITFOCUS</span>

<span class="gym">GYM</span>

</a>

</div>

</nav>

<section class="header">

<h2>

<i class="bi bi-graph-up-arrow"></i>

Progress Tracking

</h2>

<p>

Trainer can update and monitor member fitness progress

</p>

</section>

<div class="container my-5">

<div class="card p-4">

<h3 class="section-title">

<i class="bi bi-person-circle"></i>

Member Progress Details

</h3>

<hr>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Member Name</label>

<input type="text" class="form-control" value="Rahul Krishna">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Membership ID</label>

<input type="text" class="form-control" value="M101">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Current Weight (kg)</label>

<input type="number" class="form-control" value="72">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Target Weight (kg)</label>

<input type="number" class="form-control" value="68">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">BMI</label>

<input type="text" class="form-control" value="23.5">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Body Fat (%)</label>

<input type="number" class="form-control" value="18">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Fitness Goal</label>

<select class="form-select">

<option>Weight Loss</option>

<option selected>Muscle Gain</option>

<option>General Fitness</option>

<option>Strength Training</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Progress Status</label>

<select class="form-select">

<option selected>Improving</option>

<option>Excellent</option>

<option>Needs Improvement</option>

</select>

</div>

<div class="col-md-12 mb-3">

<label class="form-label">Trainer Remarks</label>

<textarea class="form-control" rows="4" placeholder="Enter trainer comments...">Member is following the workout plan consistently. Continue increasing protein intake.</textarea>

</div>

</div>

<div class="mb-4">

<label class="form-label">

Overall Progress

</label>

<div class="progress">

<div class="progress-bar bg-success" style="width:70%;">

70%

</div>

</div>

</div>

<div class="text-center">

<button class="btn btn-save px-5">

<i class="bi bi-save-fill"></i>

Update Progress

</button>

<a href="trainer_dashboard.html" class="btn btn-secondary px-5 ms-2">

<i class="bi bi-arrow-left"></i>

Back

</a>

</div>

</form>

</div>

</div>

<footer class="text-center">

<h5>FitFocus Gym Management System</h5>

<p>Email : support@fitfocus.com</p>

<p>Phone : +91 9876543210</p>

<p>© 2026 FitFocus. All Rights Reserved.</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
