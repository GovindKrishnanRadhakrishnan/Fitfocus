<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitFocus | Progress Tracking</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:0;
}

.container{
    width:50%;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
    color:#d62828;
    margin-bottom:25px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

input,textarea,select{
    width:100%;
    padding:9px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
    box-sizing:border-box;
}

textarea{
    resize:none;
}

.buttons{
    text-align:center;
    margin-top:25px;
}

button,
.back{
    padding:10px 22px;
    font-size:15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:5px;
}

.update{
    background:green;
    color:white;
}

.reset{
    background:orange;
    color:white;
}

.back{
    background:gray;
    color:white;
    text-decoration:none;
    display:inline-block;
}

</style>

</head>

<body>

<div class="container">

<h2>Update My Progress</h2>

<form>

<label>Member Name</label>

<input type="text" placeholder="Enter Name">


<label>Current Weight (kg)</label>

<input type="number" placeholder="Enter Current Weight">


<label>Progress Date</label>

<input type="date">


<label>Fitness Improvements</label>

<textarea rows="3"
placeholder="Example: Improved stamina, lost weight, better flexibility"></textarea>


<label>Overall Satisfaction</label>

<select>

<option>Excellent</option>
<option>Very Good</option>
<option>Good</option>
<option>Average</option>
<option>Poor</option>

</select>


<div class="buttons">

<a href="view_progress.html" class="update">
Save Progress
</a>



<a href="client_dashboard.html" class="back">
Back
</a>

</div>

</form>

</div>

</body>

</html>
