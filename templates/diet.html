<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diet Plan Assignment | FitFocus Gym</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  body {
    background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    min-height: 100vh;
  }
  .navbar {
    background: #000;
    border-bottom: 3px solid #ff9800;
    padding: 1rem 0;
  }
  .navbar-brand {
    font-weight: 700;
    font-size: 1.5rem;
    color: #ff9800 !important;
  }
  .card {
    background: #252525;
    border: none;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(255, 152, 0, 0.2);
    margin-top: 2rem;
    margin-bottom: 2rem;
  }
  .card-header {
    background: linear-gradient(135deg, #ff9800 0%, #ffb347 100%);
    color: #000;
    font-size: 1.25rem;
    font-weight: 700;
    border-radius: 15px 15px 0 0 !important;
    padding: 1.5rem;
  }
  label {
    color: #ffb347;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }
  .form-control,
  .form-select {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
  }
  .form-control::placeholder {
    color: #999;
  }
  .form-control:focus,
  .form-select:focus {
    background: #333;
    color: #fff;
    border-color: #ff9800;
    box-shadow: 0 0 0 0.2rem rgba(255, 152, 0, 0.25);
  }
  .table {
    color: #fff;
  }
  .table thead th {
    background: #333;
    border-color: #555;
    font-weight: 600;
  }
  .table td {
    border-color: #444;
    vertical-align: middle;
  }
  .table tbody tr:hover {
    background: rgba(255, 152, 0, 0.05);
  }
  .btn-save {
    background: #ff9800;
    color: #000;
    font-weight: 600;
    border: none;
    padding: 0.75rem 1.75rem;
    border-radius: 25px;
    transition: all 0.3s;
  }
  .btn-save:hover {
    background: #ffb347;
    color: #000;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
  }
  .btn-update {
    background: #198754;
    color: white;
    font-weight: 600;
    border: none;
    padding: 0.75rem 1.75rem;
    border-radius: 25px;
    transition: all 0.3s;
    margin-left: 0.5rem;
  }
  .btn-update:hover {
    background: #157347;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
  }
  footer {
    margin-top: 3rem;
    text-align: center;
    color: #999;
    padding: 2rem;
    border-top: 1px solid #444;
  }
  .section-title {
    color: #ffb347;
    font-weight: 700;
    margin-top: 1.5rem;
    margin-bottom: 1rem;
  }
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand">
      <i class="fa-solid fa-dumbbell"></i> FitFocus Gym
    </a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <div class="card-header">
      <i class="fa-solid fa-utensils"></i> Diet Plan Assignment (Trainer/Admin)
    </div>
    <div class="card-body p-4">
      <form>
        <!-- Client Information -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="clientName" class="form-label">Client Name</label>
            <input type="text" class="form-control" id="clientName">
          </div>
          <div class="col-md-6 mb-3">
            <label for="memberId" class="form-label">Member ID</label>
            <input type="text" class="form-control" id="memberId">
          </div>
        </div>

        <!-- Fitness Details -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="fitnessGoal" class="form-label">Fitness Goal</label>
            <select class="form-select" id="fitnessGoal">
              <option value="">Select Goal</option>
              <option>Weight Loss</option>
              <option>Weight Gain</option>
              <option>Muscle Building</option>
              <option>General Fitness</option>
            </select>
          </div>
          <div class="col-md-3 mb-3">
            <label for="height" class="form-label">Height (cm)</label>
            <input type="number" class="form-control" id="height">
          </div>
          <div class="col-md-3 mb-3">
            <label for="weight" class="form-label">Weight (kg)</label>
            <input type="number" class="form-control" id="weight">
          </div>
        </div>

        <!-- Daily Diet Schedule -->
        <h4 class="section-title">Daily Diet Schedule</h4>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Meal</th>
                <th>Diet Plan</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="fw-bold">Breakfast</td>
                <td><input class="form-control form-control-sm" type="text"></td>
              </tr>
              <tr>
                <td class="fw-bold">Mid-Morning</td>
                <td><input class="form-control form-control-sm" type="text"></td>
              </tr>
              <tr>
                <td class="fw-bold">Lunch</td>
                <td><input class="form-control form-control-sm" type="text"></td>
              </tr>
              <tr>
                <td class="fw-bold">Evening Snack</td>
                <td><input class="form-control form-control-sm" type="text"></td>
              </tr>
              <tr>
                <td class="fw-bold">Dinner</td>
                <td><input class="form-control form-control-sm" type="text"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Water Intake and Supplements -->
        <div class="row mt-3">
          <div class="col-md-6 mb-3">
            <label for="waterIntake" class="form-label">Water Intake (Litres)</label>
            <input type="number" class="form-control" id="waterIntake" placeholder="Example: 3">
          </div>
          <div class="col-md-6 mb-3">
            <label for="supplements" class="form-label">Supplements</label>
            <input type="text" class="form-control" id="supplements" placeholder="Protein, Creatine, etc.">
          </div>
        </div>

        <!-- Trainer Notes -->
        <div class="mb-3">
          <label for="trainerNotes" class="form-label">Trainer Notes</label>
          <textarea class="form-control" id="trainerNotes" rows="4" placeholder="Enter special instructions..."></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="text-end mt-4">
          <button type="submit" class="btn btn-save">
            <i class="fa-solid fa-floppy-disk"></i> Save Diet
          </button>
          <button type="button" class="btn btn-update">
            <i class="fa-solid fa-pen"></i> Update Diet
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<footer>
  © 2026 FitFocus Gym Management System
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
