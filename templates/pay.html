<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FitFocus | Membership Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.navbar{
    background:#000;
    border-bottom:2px solid orange;
}

.payment-card{
    background:#1b1b1b;
    border-radius:20px;
    padding:35px;
    margin-top:40px;
    box-shadow:0 0 20px rgba(255,165,0,.25);
}

h2{
    color:orange;
    text-align:center;
    margin-bottom:30px;
}

label{
    color:#ffb347;
    font-weight:bold;
}

.form-control,
.form-select{
    background:#2b2b2b;
    color:white;
    border:1px solid #555;
}

.form-control:focus,
.form-select:focus{
    background:#2b2b2b;
    color:white;
    border-color:orange;
    box-shadow:none;
}

.btn-pay{
    width:100%;
    background:orange;
    color:black;
    font-weight:bold;
    border:none;
    padding:12px;
    border-radius:30px;
}

.btn-pay:hover{
    background:#ffb347;
}

.summary{
    background:#262626;
    border-left:5px solid orange;
    padding:15px;
    margin-top:25px;
    border-radius:10px;
}

footer{
    margin-top:50px;
    text-align:center;
    color:#888;
    padding:20px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">
<div class="container">
<a class="navbar-brand fw-bold">
🏋 FitFocus Gym
</a>
</div>
</nav>

<div class="container">

<div class="payment-card">

<h2><i class="fa-solid fa-credit-card"></i> Membership Payment</h2>

<form>

<div class="row">

<div class="col-md-6 mb-3">
<label>Member ID</label>
<input type="text" class="form-control" placeholder="FF1001">
</div>

<div class="col-md-6 mb-3">
<label>Member Name</label>
<input type="text" class="form-control" placeholder="Enter Name">
</div>

<div class="col-md-6 mb-3">
<label>Membership Plan</label>
<select class="form-select">
<option>Monthly</option>
<option>Quarterly</option>
<option>Half-Yearly</option>
<option>Yearly</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Amount (₹)</label>
<input type="number" class="form-control" placeholder="Enter Amount">
</div>

<div class="col-md-6 mb-3">
<label>Payment Method</label>
<select class="form-select">
<option>UPI</option>
<option>Credit Card</option>
<option>Debit Card</option>
<option>Net Banking</option>
<option>Cash</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Payment Date</label>
<input type="date" class="form-control">
</div>

</div>

<div class="summary">

<h5>Payment Summary</h5>

<p><strong>Plan:</strong> Monthly Membership</p>

<p><strong>Amount:</strong> ₹1000</p>

<p><strong>Status:</strong>
<span class="badge bg-warning text-dark">Pending</span>
</p>

</div>

<button class="btn-pay mt-4">

<i class="fa-solid fa-wallet"></i>

Pay Now

</button>

</form>

</div>

</div>

<footer>

© 2026 FitFocus Gym Management System

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
