<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitFocus | Assign Diet Plan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
background:#f4f6f9;
font-family:'Segoe UI',sans-serif;
}

.navbar{
background:#111;
}

.navbar-brand{
color:#edff4d!important;
font-size:28px;
font-weight:bold;
}

.header{

background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

padding:70px;

text-align:center;

color:white;

}

.card{

border:none;

border-radius:18px;

box-shadow:0 8px 20px rgba(0,0,0,.12);

}

.section-title{

color:#dc3545;

font-weight:bold;

}

.form-label{

font-weight:600;

}

.btn-assign{

background:#dc3545;

color:white;

font-size:18px;

font-weight:bold;

border-radius:30px;

padding:12px;

}

.btn-assign:hover{

background:#bb2d3b;

color:white;

}

footer{

background:#111;

color:white;

padding:20px;

margin-top:40px;

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand" href="#">FitFocus Admin</a>

</div>

</nav>

<section class="header">

<h1>Assign Diet Plan</h1>

<p>Create personalized diet plans for gym members</p>

</section>

<div class="container my-5">

<div class="card p-4">

<h3 class="section-title">

<i class="bi bi-egg-fried"></i>

Diet Plan Assignment

</h3>

<hr>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Select Member</label>

<select class="form-select">

<option>Select Member</option>

<option>John Mathew</option>

<option>Rahul Kumar</option>

<option>Arun Das</option>

<option>Anjali Nair</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Fitness Goal</label>

<select class="form-select">

<option>Weight Loss</option>

<option>Muscle Gain</option>

<option>Body Building</option>

<option>General Fitness</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Start Date</label>

<input type="date" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">End Date</label>

<input type="date" class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Breakfast</label>

<input
type="text"
class="form-control"
placeholder="Breakfast Plan">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Morning Snack</label>

<input
type="text"
class="form-control"
placeholder="Snack Plan">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Lunch</label>

<input
type="text"
class="form-control"
placeholder="Lunch Plan">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Evening Snack</label>

<input
type="text"
class="form-control"
placeholder="Evening Snack">

</div>

<div class="col-md-12 mb-3">

<label class="form-label">Dinner</label>

<input
type="text"
class="form-control"
placeholder="Dinner Plan">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Water Intake</label>

<input
type="text"
class="form-control"
placeholder="Example : 3 Litres">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Supplements</label>

<input
type="text"
class="form-control"
placeholder="Protein / Vitamins">

</div>

<div class="col-12 mb-3">

<label class="form-label">Special Instructions</label>

<textarea
class="form-control"
rows="4"
placeholder="Enter additional instructions..."></textarea>

</div>

<div class="text-center">

<button class="btn btn-assign">

<i class="bi bi-check-circle-fill"></i>

Assign Diet Plan

</button>

<button type="reset" class="btn btn-secondary ms-2">

<i class="bi bi-arrow-clockwise"></i>

Reset

</button>

</div>

</div>

</form>

</div>

</div>

<footer class="text-center">

<h5>FitFocus Gym Management System</h5>

<p>Admin Panel</p>

<p>© 2026 All Rights Reserved.</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
