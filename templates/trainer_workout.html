<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Assign Workout Plan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
    background:#eef2f7;
    font-family:'Segoe UI',sans-serif;
}

.navbar{
    background:#111;
}

.navbar-brand{
    font-size:30px;
    font-weight:bold;
}

.fit{
    color:#dc3545;
}

.gym{
    color:#edff4d;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.card-header{
    background:linear-gradient(135deg,#ff9800,#ff5722);
    color:white;
    border-radius:20px 20px 0 0 !important;
}

.btn-save{
    background:#ff9800;
    color:white;
    font-weight:bold;
}

.btn-save:hover{
    background:#ff5722;
    color:white;
}

footer{
    margin-top:50px;
    background:#111;
    color:white;
    text-align:center;
    padding:15px;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand">

<span class="fit">FITFOCUS</span>

<span class="gym">GYM</span>

</a>

<span class="text-white">

<i class="bi bi-person-badge-fill"></i>

Trainer Panel

</span>

</div>

</nav>

<!-- Workout Form -->

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card">

<div class="card-header text-center">

<h2>

<i class="bi bi-activity"></i>

Assign Workout Plan

</h2>

</div>

<div class="card-body">

<form method="POST">



<div class="mb-3">

<label class="form-label">Select Member</label>

<select class="form-select" name="member">

<option selected disabled>Select Member</option>

{% for member in members %}

<option value="{{ member.id }}">{{ member.name }}</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">Workout Name</label>

<input type="text" class="form-control" name="workout_name"
placeholder="Example: Chest Workout">

</div>

<div class="row">

<div class="col-md-4">

<label class="form-label">Exercise</label>

<input type="text" class="form-control" name="exercise">

</div>

<div class="col-md-4">

<label class="form-label">Sets</label>

<input type="number" class="form-control" name="sets">

</div>

<div class="col-md-4">

<label class="form-label">Repetitions</label>

<input type="number" class="form-control" name="reps">

</div>

</div>

<div class="row mt-3">

<div class="col-md-6">

<label class="form-label">Duration</label>

<input type="text" class="form-control"
name="duration"
placeholder="45 Minutes">

</div>

<div class="col-md-6">

<label class="form-label">Workout Days</label>

<select class="form-select" name="days">

<option>Monday-Friday</option>

<option>Monday-Saturday</option>

<option>Alternate Days</option>

<option>Daily</option>

</select>

</div>

</div>

<div class="mt-3">

<label class="form-label">Instructions</label>

<textarea class="form-control"
rows="4"
name="instructions"
placeholder="Workout instructions"></textarea>

</div>

<div class="text-center mt-4">

<button class="btn btn-save btn-lg">

<i class="bi bi-check-circle"></i>

Assign Workout

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<footer>

© 2026 FitFocus Gym Management System

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
