```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FitFocus Gym | User Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438');
    background-size:cover;
    background-position:center;
}

.container-box{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:400px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:20px;
    color:white;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    font-weight:bold;
}

.form-control{
    margin-bottom:15px;
    border-radius:10px;
    padding:10px;
}

.btn-login{
    width:100%;
    background:#ff9800;
    color:white;
    font-weight:bold;
    border:none;
    border-radius:30px;
    padding:10px;
    transition:.3s;
}

.btn-login:hover{
    background:#e68900;
}

.extra-links{
    text-align:center;
    margin-top:15px;
}

.extra-links a{
    color:#ffd54f;
    text-decoration:none;
    font-weight:bold;
}

.extra-links p{
    margin-top:10px;
    margin-bottom:0;
}

</style>

</head>

<body>

<div class="container-box">

<div class="login-box">

<h2>🏋 FitFocus Login</h2>

<form method="POST">
    

<label>Email ID</label>
<input
type="email"
name="email"
class="form-control"
placeholder="Enter your registered email"
required>

<label>Password</label>
<input
type="password"
name="password"
class="form-control"
placeholder="Enter your password"
required>

<button type="submit" class="btn-login">
Login
</button>

<div class="extra-links">
<a href="#">Forgot Password?</a>

<p>
Don't have an account?
<a href="{% url 'register' %}">Register</a>
</p>
</div>

</form>

</div>

</div>

</body>
</html>
```
