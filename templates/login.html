<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FitFocus Gym | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

/* Professional Background */

body{

background:
linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.72)),
url("https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1920&q=80");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

.login-box{

width:420px;

background:white;

padding:35px;

border-radius:18px;

box-shadow:0 15px 40px rgba(0,0,0,.45);

}

.title{

text-align:center;

font-size:34px;

font-weight:bold;

color:#444;

margin-bottom:30px;

}

.input-group{

margin-bottom:20px;

}

.input-group-text{

background:#f2f2f2;

border:1px solid #ccc;

}

.form-control{

height:50px;

}

.roles{

margin-top:15px;

margin-bottom:20px;

}

.roles label{

font-weight:600;

margin-bottom:10px;

display:block;

}

.login-btn{

background:linear-gradient(to right,#ffd54f,#ffb300);

border:none;

border-radius:30px;

font-size:18px;

font-weight:bold;

color:#444;

padding:12px;

width:100%;

transition:.3s;

}

.login-btn:hover{

background:linear-gradient(to right,#ff9800,#ff5722);

color:white;

}

.links{

margin-top:20px;

text-align:center;

}

.links a{

text-decoration:none;

color:#0d6efd;

font-weight:600;

}

.links a:hover{

text-decoration:underline;

}

.logo{

text-align:center;

margin-bottom:20px;

}

.logo h1{

font-size:42px;

font-weight:bold;

letter-spacing:2px;

}

.fit{

color:#dc3545;

}

.gym{

color:#edff4d;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

<h1>

<span class="fit">FITFOCUS</span>

<span class="gym">GYM</span>

</h1>

</div>

<h2 class="title">Login Form</h2>

<form method="POST" action="{% url 'login' %}">
    {% csrf_token %}

<div class="input-group">

<span class="input-group-text">

<i class="fa fa-envelope"></i>

</span>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="input-group">

<span class="input-group-text">

<i class="fa fa-lock"></i>

</span>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<div class="row roles">

<div class="col-6">

<label>
<input type="radio" name="role" value="admin">
 Admin
</label>

<label>
<input type="radio" name="role" value="trainer">
 Trainer
</label>

<label>
<input type="radio" name="role" value="member" checked>
 Member
</label>
</div>

<div class="col-6 text-end">

<a href="#">Forgot Password?</a>

</div>

</div>

<div class="d-grid">

<div class="d-grid">
    <button type="submit" class="login-btn">
        <i class="fa fa-right-to-bracket"></i>
        Login
    </button>
</div>

</div>

<div class="links">

<p class="mt-3">

Don't have an account?

<a href="{% url 'register' %}"></a>
Register

</a>

</p>

<p>

<a href="{% url 'home' %}"></a>

<i class="fa fa-arrow-left"></i>

 Back to Home

</a>

</p>

</div>

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
