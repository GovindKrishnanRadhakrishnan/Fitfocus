<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FitFocus Gym | Login</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
    url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1500&q=80");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

}

.login-page{

    min-height:100vh;

}

.login-card{

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    border:none;

    border-radius:25px;

    box-shadow:0 15px 40px rgba(0,0,0,.6);

    color:white;

    transition:.4s;

}

.login-card:hover{

    transform:translateY(-8px);

    box-shadow:0 20px 50px rgba(0,0,0,.8);

}

.logo{

    width:90px;

    height:90px;

    background:linear-gradient(45deg,#ff9800,#ff5722);

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:auto;

    box-shadow:0 0 20px rgba(255,152,0,.5);

}

.logo i{

    font-size:40px;

    color:white;

}

h2{

    color:#ff9800;

    font-weight:bold;

}

label{

    color:#ffcc80;

    font-weight:600;

}

.input-group-text{

    background:#ff9800;

    color:white;

    border:none;

}

.form-control{

    background:rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.2);

    color:white;

    height:50px;

}

.form-control::placeholder{

    color:#dddddd;

}

.form-control:focus{

    background:rgba(255,255,255,.12);

    color:white;

    border-color:#ff9800;

    box-shadow:0 0 10px rgba(255,152,0,.4);

}

.login-btn{

    background:linear-gradient(45deg,#ff9800,#ff5722);

    color:white;

    border:none;

    border-radius:30px;

    padding:12px;

    font-size:18px;

    font-weight:bold;

    transition:.3s;

}

.login-btn:hover{

    background:linear-gradient(45deg,#ff5722,#ff9800);

    color:white;

    transform:scale(1.03);

    box-shadow:0 10px 20px rgba(255,152,0,.5);

}

.extra-links a{

    color:#ffd54f;

    text-decoration:none;

    font-weight:600;

}

.extra-links a:hover{

    color:#ff9800;

    text-decoration:underline;

}

hr{

    border-color:rgba(255,255,255,.3);

}

</style>

</head>

<body>

<div class="container-fluid login-page">

<div class="row justify-content-center align-items-center vh-100">

<div class="col-lg-4 col-md-6 col-sm-10">

<div class="card login-card">

<div class="card-body p-5">

<div class="text-center">

<div class="logo mb-3">

<i class="fa-solid fa-dumbbell"></i>

</div>

<h2>FitFocus Login</h2>

<p class="text-light mb-4">
Welcome Back! Login to continue your fitness journey.
</p>

</div>

<form action="#" method="post">

<div class="mb-3">

<label class="form-label">Email Address</label>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-envelope"></i>

</span>

<input
type="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

</div>

<div class="mb-4">

<label class="form-label">Password</label>

<div class="input-group">

<span class="input-group-text">

<i class="fa-solid fa-lock"></i>

</span>

<input
type="password"
class="form-control"
placeholder="Enter your password"
required>

</div>

</div>

<div class="d-grid">

<button class="btn login-btn">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

</div>

<div class="extra-links text-center mt-4">

<p>

<a href="#">Forgot Password?</a>

</p>

<hr>

<p class="text-light">

Don't have an account?

<a href="register.html">

Register Here

</a>

</p>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
