{% extends "base.html" %}

{% block body_class %}page-dashboard{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-3 col-xl-2 sidebar p-3">
            {% include "includes/sidebar.html" %}
        </aside>
        <main class="col-lg-9 col-xl-10 p-3 p-md-4">
            <div class="dashboard-toolbar">
                <button class="btn btn-accent" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
                    <i class="fa-solid fa-bars me-1"></i> Menu
                </button>
                <span class="role-chip"><i class="fa-solid fa-user"></i> {{ user.get_role_display }}</span>
            </div>
            {% block dashboard_content %}{% endblock %}
        </main>
    </div>
</div>

<div class="offcanvas offcanvas-start offcanvas-fitfocus" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
    <div class="offcanvas-header">
        <h2 class="h5 offcanvas-title" id="sidebarMenuLabel">FITFOCUS</h2>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        {% include "includes/sidebar.html" %}
    </div>
</div>
{% endblock %}
