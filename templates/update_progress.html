<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitFocus | Update Progress</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
background:#eef2f7;
font-family:'Segoe UI',sans-serif;
}

.navbar{
background:#111;
}

.navbar-brand{
font-size:28px;
font-weight:bold;
}

.fit{
color:#dc3545;
}

.gym{
color:#ffd43b;
}

.header{

background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

padding:70px;

text-align:center;

color:white;

}

.card{

border:none;

border-radius:20px;

box-shadow:0 10px 20px rgba(0,0,0,.15);

}

.section-title{

color:#dc3545;

font-weight:bold;

}

.form-control,
.form-select{

border-radius:10px;

}

.btn-save{

background:#198754;

color:white;

font-weight:bold;

}

.btn-save:hover{

background:#157347;

color:white;

}

footer{

background:#111;

color:white;

padding:20px;

margin-top:40px;

}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand">

<span class="fit">FITFOCUS</span>

<span class="gym">GYM</span>

</a>

</div>

</nav>

<section class="header">

<h2>

<i class="bi bi-pencil-square"></i>

Update Member Progress

</h2>

<p>

Trainer can update member fitness records

</p>

</section>

<div class="container my-5">

<div class="card p-5">

<h3 class="section-title">

<i class="bi bi-person-fill"></i>

Member Information

</h3>

<hr>

<form>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Member Name</label>
<input type="text" class="form-control" placeholder="Enter Member Name">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Member ID</label>
<input type="text" class="form-control" placeholder="FF101">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Trainer Name</label>
<input type="text" class="form-control" placeholder="Enter Trainer Name">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Date Joined</label>
<input type="date" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Today's Date</label>
<input type="date" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Old Height (cm)</label>
<input type="number" class="form-control" placeholder="170">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Current Height (cm)</label>
<input type="number" class="form-control" placeholder="170">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Old Weight (kg)</label>
<input type="number" class="form-control" placeholder="85">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Current Weight (kg)</label>
<input type="number" class="form-control" placeholder="78">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Fitness Goal</label>
<select class="form-select">
<option>Select Goal</option>
<option>Weight Loss</option>
<option>Weight Gain</option>
<option>Muscle Gain</option>
<option>General Fitness</option>
<option>Strength Training</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Overall Progress</label>
<select class="form-select">
<option>Excellent</option>
<option>Very Good</option>
<option>Good</option>
<option>Average</option>
<option>Needs Improvement</option>
</select>
</div>

<div class="col-md-12 mb-3">
<label class="form-label">Health-wise Changes</label>
<textarea class="form-control" rows="4"
placeholder="Example: Lost 7 kg, improved stamina, better sleep, reduced stress, less body pain..."></textarea>
</div>

<div class="col-md-12 mb-3">
<label class="form-label">Client Feedback</label>
<textarea class="form-control" rows="4"
placeholder="Share your experience after joining FitFocus Gym..."></textarea>
</div>

</div>

<div class="text-center mt-4">

<a href="view_progress.html" class="btn btn-save px-5">

<i class="bi bi-check-circle-fill"></i>

Save Progress

</a>

<button type="reset" class="btn btn-warning px-5 ms-2">
<i class="bi bi-arrow-clockwise"></i>
Reset
</button>

<a href="client_dashboard.html" class="btn btn-secondary px-5 ms-2">
<i class="bi bi-arrow-left"></i>
Back
</a>

</div>

</form>

</div>

</div>

<footer class="text-center">

<h5>FitFocus Gym Management System</h5>

<p>Email : support@fitfocus.com</p>

<p>Phone : +91 9876543210</p>

<p>© 2026 FitFocus. All Rights Reserved.</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
