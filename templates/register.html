<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FitFocus | Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
url("https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=1500&q=80");

background-size:cover;
background-position:center;
background-attachment:fixed;

}

.register-page{

padding:50px 0;

}

.register-card{

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border:none;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.6);

color:white;

}

.logo{

width:90px;

height:90px;

background:linear-gradient(45deg,#ff9800,#ff5722);

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

margin:auto;

box-shadow:0 0 20px rgba(255,152,0,.5);

}

.logo i{

font-size:40px;

color:white;

}

h2{

color:#ff9800;

font-weight:bold;

}

label{

color:#ffcc80;

font-weight:600;

}

.form-control,
.form-select{

background:rgba(255,255,255,.12);

border:1px solid rgba(255,255,255,.2);

color:white;

height:50px;

}

textarea.form-control{

height:auto;

}

.form-control::placeholder{

color:#dddddd;

}

.form-control:focus,
.form-select:focus{

background:rgba(255,255,255,.12);

color:white;

border-color:#ff9800;

box-shadow:0 0 10px rgba(255,152,0,.4);

}

.form-select option{
    color:black;
    background:white;
}
.register-btn{

background:linear-gradient(45deg,#ff9800,#ff5722);

color:white;

border:none;

border-radius:30px;

padding:12px;

font-size:18px;

font-weight:bold;

transition:.3s;

}

.register-btn:hover{

background:linear-gradient(45deg,#ff5722,#ff9800);

transform:scale(1.03);

color:white;

}

a{

color:#ffd54f;

text-decoration:none;

font-weight:bold;

}

a:hover{

color:#ff9800;

}

</style>

</head>

<body>

<div class="container register-page">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card register-card">

<div class="card-body p-5">

<div class="text-center mb-4">

<div class="logo mb-3">

<i class="fa-solid fa-dumbbell"></i>

</div>

<h2>Create Your Account</h2>

<p class="text-light">

Join FitFocus and begin your fitness journey today.

</p>

</div>

<form method="POST">
   

<div class="row">

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input
type="text"
name="fullname"
class="form-control"
placeholder="Enter Full Name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Date of Birth</label>

<input type="date" name="dob" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Age</label>

<input type="number" name="age" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Gender</label>

<label>Gender</label>

<select name="gender" class="form-select" required>
    <option value="" selected disabled>Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
    <option value="Other">Other</option>
</select>

</div>

<div class="col-md-6 mb-3">

<label>Phone Number</label>

<input type="tel" name="phone" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Email Address</label>

<input type="email" name="email" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Height (cm)</label>

<input type="number" name="height" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Weight (kg)</label>

<input type="number" name="weight" class="form-control" required>

</div>

<div class="col-12 mb-3">

<label>Address</label>

<textarea name="address" class="form-control"></textarea>

</div>

<div class="col-12 mb-3">

<label>Fitness Goal</label>

<label>Fitness Goal</label>

<select name="goal" class="form-select" required>
    <option value="" selected disabled>Select Goal</option>
    <option value="Weight Loss">Weight Loss</option>
    <option value="Muscle Gain">Muscle Gain</option>
    <option value="Body Building">Body Building</option>
    <option value="Fitness Maintenance">Fitness Maintenance</option>
    <option value="General Fitness">General Fitness</option>
</select>

</div>

<div class="col-md-6 mb-3">

<label>Password</label>

<input type="password" name="password" class="form-control" required>

</div>

<div class="col-md-6 mb-4">

<label>Confirm Password</label>

<input type="password" name="confirm_password" class="form-control" required>

</div>

<div class="d-grid">

<button type="submit" class="btn register-btn">
    <i class="fa-solid fa-user-plus"></i>
    Register
</button>

</div>

<div class="text-center mt-4">

<p class="text-light">

Already have an account?

<a href="{% url 'login' %}">
    Login Here
</a>

</p>

</div>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
