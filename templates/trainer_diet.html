```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitFocus | Assign Diet Plan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
    background:#f4f6f9;
    font-family:'Segoe UI',sans-serif;
}

.navbar{
    background:#111;
}

.navbar-brand{
    color:#edff4d !important;
    font-size:28px;
    font-weight:bold;
}

.header{
    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
    padding:60px 0;
    text-align:center;
    color:white;
}

.card{
    border:none;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.card-title{
    color:#dc3545;
    font-weight:bold;
}

.form-label{
    font-weight:600;
}

textarea{
    resize:none;
}

.btn-save{
    background:#dc3545;
    color:white;
    font-weight:bold;
    border-radius:30px;
    padding:10px 25px;
}

.btn-save:hover{
    background:#bb2d3b;
    color:white;
}

footer{
    background:#111;
    color:white;
    padding:20px;
    margin-top:40px;
}

</style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

<div class="container">

<a class="navbar-brand">
    FitFocus Trainer
</a>

</div>

</nav>


<!-- HEADER -->

<section class="header">

<h1>
<i class="bi bi-clipboard-heart"></i>
Assign Diet Plan
</h1>

</section>


<!-- MAIN CONTENT -->

<div class="container my-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card p-4">

<h4 class="card-title mb-4">
<i class="bi bi-person-fill"></i>
Member Diet Plan
</h4>

<form>


<!-- MEMBER -->

<div class="mb-3">

<label class="form-label">
Select Member
</label>

<select class="form-select">

<option>Select Member</option>
<option>Nandana P N</option>
<option>Rahul Kumar</option>
<option>Anjali Nair</option>
<option>John Mathew</option>

</select>

</div>


<!-- DIET PLAN -->

<div class="mb-3">

<label class="form-label">
Diet Plan
</label>

<textarea class="form-control"
rows="7"
placeholder="Enter the diet plan for the member...

Example:
Breakfast: Oats and fruits
Lunch: Rice, vegetables and chicken
Snacks: Fruits or nuts
Dinner: Chapati and vegetables"></textarea>

</div>


<!-- WATER -->

<div class="mb-3">

<label class="form-label">
Water Intake
</label>

<input type="text"
class="form-control"
placeholder="Example: 3 Litres per day">

</div>


<!-- DURATION -->

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Start Date
</label>

<input type="date"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
End Date
</label>

<input type="date"
class="form-control">

</div>

</div>


<!-- INSTRUCTIONS -->

<div class="mb-4">

<label class="form-label">
Instructions
</label>

<textarea class="form-control"
rows="3"
placeholder="Enter any important instructions"></textarea>

</div>


<!-- BUTTONS -->

<div class="text-center">

<button type="submit"
class="btn btn-save">

<i class="bi bi-check-circle-fill"></i>
Assign Diet Plan

</button>

<button type="reset"
class="btn btn-secondary ms-2">

Reset

</button>

</div>


</form>

</div>

</div>

</div>

</div>


<!-- FOOTER -->

<footer class="text-center">

<h5>FitFocus Gym Management System</h5>

<p>© 2026 All Rights Reserved.</p>

</footer>


</body>
</html>
