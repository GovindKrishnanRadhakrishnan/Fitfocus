<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitFocus | Edit Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
background:#eef2f7;
font-family:'Segoe UI',sans-serif;
}

.navbar{
background:#111;
}

.navbar-brand{
font-size:30px;
font-weight:bold;
}

.fit{
color:#dc3545;
}

.gym{
color:#edff4d;
}

.header{

background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

padding:60px;

text-align:center;

color:white;

}

.profile-image{

width:140px;

height:140px;

border-radius:50%;

border:5px solid white;

object-fit:cover;

}

.card{

border:none;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.12);

}

.section-title{

color:#dc3545;

font-weight:bold;

}

.btn-save{

background:#198754;

color:white;

font-weight:bold;

}

.btn-save:hover{

background:#157347;

color:white;

}

.btn-back{

background:#6c757d;

color:white;

font-weight:bold;

}

footer{

background:#111;

color:white;

padding:20px;

margin-top:40px;

text-align:center;

}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand">

<span class="fit">FITFOCUS</span>

<span class="gym">GYM</span>

</a>

</div>

</nav>

<section class="header">

<img src="https://i.pravatar.cc/200" class="profile-image">

<h2 class="mt-3">Edit Profile</h2>

<p>Update your personal information</p>

</section>

<div class="container my-5">

<div class="card p-5">

<h3 class="section-title">

<i class="bi bi-pencil-square"></i>

Personal Details

</h3>

<hr>

<form>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Full Name</label>

<input type="text" class="form-control" value="Nandana P N">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Email</label>

<input type="email" class="form-control" value="nandana@gmail.com">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Phone Number</label>

<input type="text" class="form-control" value="9876543210">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Age</label>

<input type="number" class="form-control" value="21">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Gender</label>

<select class="form-select">

<option selected>Female</option>

<option>Male</option>

<option>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Height (cm)</label>

<input type="number" class="form-control" value="165">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Weight (kg)</label>

<input type="number" class="form-control" value="60">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Fitness Goal</label>

<select class="form-select">

<option selected>Weight Loss</option>

<option>Weight Gain</option>

<option>Muscle Gain</option>

<option>Fitness</option>

</select>

</div>

<div class="col-md-12 mb-3">

<label class="form-label">Address</label>

<textarea class="form-control" rows="3">East Kadungallur, Aluva, Ernakulam, Kerala</textarea>

</div>

<div class="col-md-12 mb-3">

<label class="form-label">

Profile Picture

</label>

<input type="file" class="form-control">

</div>

</div>

<div class="text-center mt-4">

<a href="save_profile.html" class="btn btn-save px-5">

<i class="bi bi-check-circle-fill"></i>

Save Changes

</a>

<i class="bi bi-check-circle-fill"></i>

Save Changes

</button>

<a href="profile.html" class="btn btn-back px-5 ms-2">

<i class="bi bi-arrow-left-circle"></i>

Cancel

</a>

</div>

</form>

</div>

</div>

<footer>

<h5>FitFocus Gym Management System</h5>

<p>support@fitfocus.com</p>

<p>+91 9876543210</p>

<p>© 2026 FitFocus. All Rights Reserved.</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
