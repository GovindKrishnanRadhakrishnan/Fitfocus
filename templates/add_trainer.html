<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitFocus | Add Trainer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

body{
background:#eef2f7;
font-family:'Segoe UI',sans-serif;
}

/* Navbar */

.navbar{
background:#111;
}

.navbar-brand{
font-size:30px;
font-weight:bold;
}

.fit{
color:#dc3545;
}

.gym{
color:#ffd43b;
}

/* Header */

.header{

background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

padding:60px;

text-align:center;

color:white;

}

.header h2{
font-weight:bold;
}

/* Card */

.card{

border:none;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

/* Buttons */

.btn-save{

background:#198754;
color:white;
font-weight:bold;

}

.btn-save:hover{

background:#157347;
color:white;

}

footer{

background:#111;

color:white;

padding:20px;

margin-top:40px;

text-align:center;

}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand">

<span class="fit">FITFOCUS</span>

<span class="gym">GYM</span>

</a>

<span class="text-white">

<i class="bi bi-person-workspace"></i>

Administrator

</span>

</div>

</nav>


<!-- Header -->

<section class="header">

<h2>

<i class="bi bi-person-plus-fill"></i>

Add Trainer Details

</h2>

<p>Create a new trainer account</p>

</section>


<!-- Form -->

<div class="container my-5">

<div class="card p-5">

<form>

<div class="row">

<!-- Trainer ID -->

<div class="col-md-6 mb-3">

<label class="form-label">Trainer ID</label>

<input
type="text"
class="form-control"
placeholder="Enter Trainer ID">

</div>


<!-- Full Name -->

<div class="col-md-6 mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
class="form-control"
placeholder="Enter Full Name">

</div>


<!-- Age -->

<div class="col-md-6 mb-3">

<label class="form-label">Age</label>

<input
type="number"
class="form-control"
placeholder="Enter Age">

</div>


<!-- Gender -->

<div class="col-md-6 mb-3">

<label class="form-label">Gender</label>

<select class="form-select">

<option selected disabled>Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>


<!-- Phone -->

<div class="col-md-6 mb-3">

<label class="form-label">Phone Number</label>

<input
type="tel"
class="form-control"
placeholder="Enter Phone Number">

</div>


<!-- Email -->

<div class="col-md-6 mb-3">

<label class="form-label">Email Address</label>

<input
type="email"
class="form-control"
placeholder="Enter Email">

</div>


<!-- Qualification -->

<div class="col-md-6 mb-3">

<label class="form-label">Qualification</label>

<input
type="text"
class="form-control"
placeholder="Enter Qualification">

</div>


<!-- Specialization -->

<div class="col-md-6 mb-3">

<label class="form-label">Specialization</label>

<select class="form-select">

<option selected disabled>Select Specialization</option>

<option>Weight Loss</option>

<option>Muscle Gain</option>

<option>Strength Training</option>

<option>Yoga</option>

<option>Cardio Fitness</option>

<option>Personal Training</option>

</select>

</div>


<!-- Experience -->

<div class="col-md-12 mb-4">

<label class="form-label">Experience</label>

<input
type="text"
class="form-control"
placeholder="Example: 5 Years">

</div>


<hr class="my-3">


<!-- Login Credentials -->

<h4 class="text-danger mb-3">

<i class="bi bi-person-lock"></i>

Login Credentials

</h4>


<!-- Username -->

<div class="col-md-6 mb-3">

<label class="form-label">Username</label>

<input
type="text"
class="form-control"
placeholder="Create Username">

</div>


<!-- Password -->

<div class="col-md-6 mb-3">

<label class="form-label">Password</label>

<input
type="password"
class="form-control"
placeholder="Create Password">

</div>

</div>


<!-- Buttons -->

<div class="mt-3">

<button type="submit"
class="btn btn-success btn-lg px-5">

<i class="bi bi-check-circle-fill"></i>

Save Trainer

</button>


<button type="reset"
class="btn btn-warning btn-lg px-5 ms-2">

<i class="bi bi-arrow-clockwise"></i>

Reset

</button>


<a href="{% url 'admin_dashboard' %}"
class="btn btn-secondary btn-lg px-5 ms-2">

<i class="bi bi-arrow-left-circle"></i>

Back

</a>

</div>

</form>

</div>

</div>


<!-- Footer -->

<footer>

<h5>FitFocus Gym Management System</h5>

<p>Email : support@fitfocus.com</p>

<p>Phone : +91 9876543210</p>

<p>© 2026 FitFocus. All Rights Reserved.</p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
